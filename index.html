<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Sift</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/frame.css">
  <link rel="stylesheet" href="css/view.css">
  <link rel="stylesheet" href="css/dialogs.css">
  <link rel="stylesheet" href="css/sift.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div class="orbs" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span></div>

  <div id="titlebar" class="titlebar">
    <span class="titlebar-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6M8 9h5M8 12h3.5"/></svg></span>
    <span class="titlebar-title">Sift</span>
    <span id="titleConn" class="titlebar-repo"></span>
  </div>

  <div class="shell">
    <nav id="sidebar" class="glass side" aria-label="Clusters and indices"></nav>
    <main class="work">
      <div id="tabs" class="glass tabs-bar" role="tablist" aria-label="Views"></div>
      <div class="views">
        <section id="view-welcome" class="view" hidden></section>
        <section id="view-query" class="view" hidden></section>
        <section id="view-docs" class="view" hidden></section>
        <section id="view-mapping" class="view" hidden></section>
        <section id="view-analyze" class="view" hidden></section>
        <section id="view-compare" class="view" hidden></section>
        <section id="view-cluster" class="view view-scroll" hidden></section>
        <section id="view-settings" class="view view-scroll" hidden></section>
      </div>
      <footer id="status" class="status-bar" aria-live="polite"></footer>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/ui/appearance.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/ui/dialog.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/json.js"></script>
  <script src="js/conn.js"></script>
  <script src="js/ui/editor.js"></script>
  <script src="js/ui/results.js"></script>
  <script src="js/ui/connform.js"></script>
  <script src="js/ui/sidebar.js"></script>
  <script src="js/ui/query.js"></script>
  <script src="js/ui/docs.js"></script>
  <script src="js/ui/mapping.js"></script>
  <script src="js/ui/analyze.js"></script>
  <script src="js/ui/compare.js"></script>
  <script src="js/ui/cluster.js"></script>
  <script src="js/ui/settings.js"></script>
  <script src="js/ui/status.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
